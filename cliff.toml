[changelog]
header = "# Changelog\n\nGenerated from Git history by GitLab CI. Do not edit entries manually.\n\n"
body = """
## {% if version %}{{ version }} ({{ timestamp | date(format="%Y-%m-%d") }}){% else %}Unreleased{% endif %}
{% for layer, layer_commits in commits | group_by(attribute="scope") %}
### {{ layer }}
{% for group, entries in layer_commits | group_by(attribute="group") %}
#### {{ group }}

{% for commit in entries %}- {{ commit.message | split(pat="\n") | first }} ([{{ commit.id | truncate(length=7, end="") }}](https://gitlab.3dcra.eu/opensource/fastsprout/fastsprout/-/commit/{{ commit.id }}))
{% endfor %}{% endfor %}{% endfor %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = false
commit_parsers = [
    { message = "^Merge ", skip = true },
    { message = "^docs: update changelog", skip = true },
    { message = ".*", scope = "Other", continue = true },
    { message = '^(docs?|examples)(\([^)]*\))?:', scope = "Documentation", continue = true },
    { message = '^(ci|build|chore|lint|quality)(\([^)]*\))?:', scope = "Tooling", continue = true },
    { message = '^[^(]+\(core(/[^)]*)?\)', scope = "Core", continue = true },
    { message = '^[^(]+\(actions(/[^)]*)?\)', scope = "Actions", continue = true },
    { message = '^[^(]+\((data|sql)(/[^)]*)?\)', scope = "Data", continue = true },
    { message = '^[^(]+\(events(/[^)]*)?\)', scope = "Events", continue = true },
    { message = "^feat", group = "Features" },
    { message = "^fix", group = "Fixes" },
    { message = ".*", group = "Changes" },
    { message = ".*", group = "Other" },
]
tag_pattern = '^v?[0-9]+\.[0-9]+\.[0-9]+([-+].*)?$'
sort_commits = "newest"
