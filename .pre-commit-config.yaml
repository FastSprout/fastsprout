repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0  # Use the ref you want to point at
    hooks:
      - id: trailing-whitespace
      - id: check-ast
      - id: check-yaml
      - id: check-case-conflict
      - id: check-illegal-windows-names
      - id: check-merge-conflict
      - id: check-toml
      - id: debug-statements
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: no-commit-to-branch
        args: [--branch, main, --branch, development]
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.12.8
    hooks:
      # Run the linter.
      - id: ruff-check
        args: [ --fix ]
      # Run the formatter.
      - id: ruff-format

  - repo: local
    hooks:
      - id: pylint-too-many-lines
        name: pylint too-many-lines (C0302)
        entry: uv run --system-certs pylint
        language: system
        types: [python]
        args:
          - --disable=all
          - --enable=C0302,C0415
          - --max-module-lines=300
          - --ignore-paths=src/tests

      - id: import-linter
        name: import-linter
        entry: uv run --system-certs lint-imports
        language: system
        types: [python]
        files: \.py$
        pass_filenames: false
        require_serial: true

      - id: basedpyright
        name: basedpyright
        entry: uv run --system-certs basedpyright src
        files: \.py$
        require_serial: true
        pass_filenames: false
        language: system
        types: [ python ]

  - repo: https://github.com/astral-sh/uv-pre-commit
    # uv version.
    rev: 0.8.10
    hooks:
      - id: uv-sync
      - id: uv-lock
