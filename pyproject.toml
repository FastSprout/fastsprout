[project]
name = "fastsprout"
version = "0.1.1"
description = "FastSprout - Python backend framework that grows from a seed. Modular monolith first. Async-native. Built on FastAPI."
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Illia Bahlai", email = "illia@bahlai.xyz" }]
requires-python = ">=3.12,<3.15"
keywords = [
    "fastsprout",
    "framework",
    "backend",
    "async",
    "modular-monolith",
    "monolith",
    "pydantic",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]
dependencies = ["pydantic>=2.13.5", "typing-extensions>=4.14"]


[project.optional-dependencies]
data-sql = ["sqlmodel==0.0.42", 'sqlalchemy']
events = ["bubus>=1.5.6", "croniter>=6.2.4"]
testing = ["hypothesis>=6.0", "pytest>=9.0.3", "pytest-asyncio>=1.4.0", "typeguard>=4.4,<5"]
standard = ["fastsprout[data-sql,events]"]
testing-data = [
    "aiosqlite>=0.22.1",
    "fastsprout[data-sql,testing]",
    "testcontainers>=4.15,<5",
]


[dependency-groups]
dev = [
    "fastsprout[testing]",
    "basedpyright>=1.39.3",
    "import-linter[ui]>=2.3",
    "ipython>=9.4.0",
    "prek>=0.5.3",
    "pylint>=4.0.5",
    "ruff>=0.12.1",
    "basedpyright>=1.39.3",
    "ipython>=9.4.0",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "pytest-asyncio>=1.4.0",
    "mypy>=2.3.1",
    "aiosqlite>=0.22.1",
    "bubus>=1.5.6",
    "faststream[kafka]>=0.7.5",
]
docs = [
    "aiosqlite>=0.22.1",
    "beautifulsoup4>=4.13,<5",
    "markdownify>=1.2,<2",
    "mkdocs-material>=9,<10",
    "mkdocstrings[python]>=0.30,<1",
    "packaging>=24",
    "ruff>=0.12.1",
]


[project.urls]
Homepage = "https://github.com/FastSprout/fastsprout"
Documentation = "https://github.com/FastSprout/fastsprout/tree/development/docs"
Repository = "https://github.com/FastSprout/fastsprout"
Issues = "https://github.com/FastSprout/fastsprout/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fastsprout"]

[tool.hatch.build.targets.wheel.force-include]
"src/fastsprout/py.typed" = "fastsprout/py.typed"

[tool.ruff]
exclude = [".git", "__pycache__", "build", "dist"]
lint.fixable = ["ALL"]
lint.unfixable = []
lint.ignore = ["E501"]
lint.select = ["B", "C9", "E", "F", "I", "N", "RUF", "UP", "T"]
line-length = 80

[tool.ruff.lint.per-file-ignores]
"examples/*.py" = ["T201", 'B008']
# Numeric prefixes define the chapter order of runnable documentation examples.
"examples/**/[0-9]*_*.py" = ["N999"]
"docs_src/*.py" = ["T201", 'B008']

[tool.ruff.lint.mccabe]
max-complexity = 5

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastsprout.core.Depends"]

[tool.ruff.lint.flake8-annotations]
mypy-init-return = true

[tool.basedpyright]
include = ["src", "examples"]
typeCheckingMode = "standard"

[[tool.basedpyright.executionEnvironments]]
root = "src/tests/fastsprout"
extraPaths = ["src", "."]
reportArgumentType = false
reportOptionalCall = false
reportCallIssue = false

[tool.pylint.main]
init-hook = "import sys; sys.path.insert(0, '.')"
load-plugins = ["tools.pylint.exports", "tools.pylint.dataclasses", "tools.pylint.names", "tools.pylint.testing"]

[tool.pylint.messages_control]
disable = ["all"]
enable = [
    "too-many-lines",
    "import-outside-toplevel",
    "missing-module-all",
    "import-outside-all",
    "private-name",
    "private-module-name",
    "missing-package-init",
    "stdlib-dataclass",
    "conflicting-test-phases",
    "untyped-test-phase",
    "redundant-test-phase-comment",
    "combined-test-phase-comment",
    "invalid-all-format",
    "invalid-all-object",
    "undefined-all-variable",
]

[tool.pylint.format]
max-module-lines = 300

[tool.pytest.ini_options]
minversion = "6.0"
pythonpath = ["."]
addopts = "-ra -vvv --cov=src/fastsprout --cov-report=term-missing"
testpaths = ["src/tests"]
asyncio_mode = "auto"
markers = [
    "unit: Unit tests - no external dependencies",
    "integration: Integration tests - testcontainers or in-memory mocks",
    "slow: Tests taking more than 5 seconds",
]

[tool.coverage.report]
fail_under = 100
precision = 2
exclude_lines = [
    "pragma: no cover",
    "pragma: full coverage",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
